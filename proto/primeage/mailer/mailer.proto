syntax = "proto3";

package primeage.mailer;

option go_package = "github.com/primeage-health/primeageutils/genproto/mailer";

// MailerService owns every outbound email the platform sends.
//
// The split it implements: a caller decides that something happened worth
// telling someone about and supplies the values; this service owns the subject
// line, the body and the sending domain. So nothing here carries message text —
// a caller that could set a subject and a body could send anything under
// PrimeAge's sending domain.
service MailerService {
  rpc SendMail(SendMailRequest) returns (SendMailResponse) {}
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse) {}
  rpc GetTemplateHtml(GetTemplateHtmlRequest) returns (GetTemplateHtmlResponse) {}
}

// SendMailRequest never carries message text.
//
// The caller names a registered template and supplies its data, which keeps the
// wording in one place and stops a caller inventing a message no template
// covers. A credential — a one-time code, a portal password — therefore travels
// inside data_map rather than as a named field, so the mailer has no reason to
// treat it as special beyond the redaction its template declares.
message SendMailRequest {
  string to = 1;
  string template_name = 2;
  map<string, string> data_map = 3;
  string domain = 4;
  string priority = 5;
}

// SendMailResponse reports delivery.
//
// status is a field rather than a gRPC status code because a duplicate
// suppressed inside the idempotency window is an outcome, not a transport
// fault: the caller is handed the first send's correlation id and must not
// retry. correlation_id is returned on failure too — it is what traces the
// attempt in the delivery log.
message SendMailResponse {
  string status = 1;
  string correlation_id = 2;
  string message = 3;
}

// ListTemplatesRequest takes no arguments.
//
// It exists rather than google.protobuf.Empty so that a filter — by domain, or
// by whether a template is safe for an operator to choose — can be added later
// without a new method and a new client call site.
message ListTemplatesRequest {}

// ListTemplatesResponse is every template a send may name, name-ordered.
//
// The order is part of the contract: the registry behind it is a map, and an
// unordered list would differ between two calls, so a caller diffing it would
// see a change that is not one.
message ListTemplatesResponse {
  repeated MailTemplate templates = 1;
}

// MailTemplate is one message this service knows how to send.
message MailTemplate {
  string name = 1;
  string subject = 2;
  // required_keys are the data keys a send must supply. A missing one is
  // refused rather than rendered blank.
  repeated string required_keys = 3;
  // secret_keys are the required keys whose values carry a credential — a
  // one-time code, a portal password. This service redacts them before writing
  // its delivery log; naming them is what lets a caller keep them out of its
  // own.
  repeated string secret_keys = 4;
}

// GetTemplateHtmlRequest names the template whose HTML is wanted.
message GetTemplateHtmlRequest {
  string template_name = 1;
}

// GetTemplateHtmlResponse is one template's raw HTML.
//
// Nothing is substituted: the body arrives with its {{ .Data.key }} placeholders
// as written, and the caller fills them in. That is what makes one fetch enough
// to render the same template against any number of recipients, and it is why
// neither message here carries a data map.
message GetTemplateHtmlResponse {
  string name = 1;
  string subject = 2;
  string html = 3;
}
